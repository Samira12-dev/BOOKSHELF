
services:
  mysql:
    image: mysql:8.0
    container_name: bookshelf-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bookshelf_db
    ports:
      - "3307:3306"
    volumes:
      - bookshelf-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pSamira12"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build: .
    container_name: bookshelf-backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bookshelf_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

volumes:
  bookshelf-db-data: